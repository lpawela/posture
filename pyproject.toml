[project]
name = "posture"
version = "0.1.0"
description = "Webcam pose-estimation form coach for squat and deadlift."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# httpx2 is what Starlette's TestClient now prefers (avoids a deprecation warning).
test = ["pytest>=8.0", "httpx>=0.27", "httpx2>=2.3"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"
# Keep the suite warning-free: any warning fails the run. Add targeted
# "ignore::..." entries here if an unavoidable third-party warning appears.
filterwarnings = ["error"]

[tool.setuptools]
packages = ["app", "app.exercises"]
